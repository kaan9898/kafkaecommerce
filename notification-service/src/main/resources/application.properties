spring.application.name=notification-service
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties[spring.json.use.type.headers]=false
spring.kafka.consumer.properties[spring.json.value.default.type]=com.kaan9898.notificationservice.dto.OrderEvent
spring.kafka.consumer.properties[spring.json.trusted.packages]=com.kaan9898.notificationservice.dto
management.endpoints.web.exposure.include=health,metrics,prometheus
management.endpoint.health.show-details=always